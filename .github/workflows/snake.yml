name: Generate Snake Animation

on:
  schedule:
    - cron: "0 18 * * *"   # every day at 01:00 Vietnam time (UTC+7)
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#8b5cf6&color_dots=#161b22,#4c1d95,#7c3aed,#a78bfa,#c4b5fd
            dist/snake.svg?palette=github-light&color_snake=#7c3aed

      - name: Push to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
